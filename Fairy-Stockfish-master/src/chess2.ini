[chess2:chess]
maxFile = 9
maxRank = 9
# Use only non-promoting WinBoard piece slots: s=knight, p=bishop, r=rook.
pieceToCharTable = .SPR.K.spr.k

customPiece1 = r:WF
customPiece2 = p:WF
customPiece3 = s:WF

# r captures only s; s captures only p; p captures only r.
captureTargets = r:s s:p p:r

flagRegionWhite = i9
flagRegionBlack = a1

startFen = 9/4pr3/4spr2/5spr1/1PS3sp1/1RPS5/2RPS4/3RP4/9 w - - 0 1
castling = false
checking = false
